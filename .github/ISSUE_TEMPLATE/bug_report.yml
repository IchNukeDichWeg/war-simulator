name: Bug report
description: Something in the app or the engine does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: The preset name, or a share link from Save & share, and the seed. A run is deterministic per seed, so this is usually enough to reproduce it.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything red in the browser console, if there is any.
      render: text
